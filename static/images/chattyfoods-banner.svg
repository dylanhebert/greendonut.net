<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- App dark background -->
  <rect width="640" height="360" fill="#0a0a0a"/>

  <!-- Nav bar -->
  <rect x="0" y="0" width="640" height="52" fill="#171717" opacity="0.8"/>
  <text x="36" y="33" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#10b981">Chatty Foods</text>
  <text x="195" y="33" font-family="system-ui, sans-serif" font-weight="400" font-size="14" fill="#9ca3af">Recipes</text>
  <text x="272" y="33" font-family="system-ui, sans-serif" font-weight="400" font-size="14" fill="#9ca3af">Tips</text>
  <text x="320" y="33" font-family="system-ui, sans-serif" font-weight="400" font-size="14" fill="#9ca3af">Search</text>

  <!-- Category filter pills -->
  <rect x="36" y="68" width="60" height="28" rx="14" fill="#10b981"/>
  <text x="66" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="13" fill="white">All</text>
  <rect x="106" y="68" width="80" height="28" rx="14" fill="#262626"/>
  <text x="146" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#9ca3af">Chicken</text>
  <rect x="196" y="68" width="80" height="28" rx="14" fill="#262626"/>
  <text x="236" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#9ca3af">Seafood</text>
  <rect x="286" y="68" width="62" height="28" rx="14" fill="#262626"/>
  <text x="317" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#9ca3af">Sushi</text>
  <rect x="358" y="68" width="76" height="28" rx="14" fill="#262626"/>
  <text x="396" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#9ca3af">Dessert</text>
  <rect x="444" y="68" width="66" height="28" rx="14" fill="#262626"/>
  <text x="477" y="87" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="400" font-size="13" fill="#9ca3af">Sauce</text>

  <!-- Recipe card 1 -->
  <rect x="36" y="114" width="568" height="108" rx="10" fill="#171717" stroke="#262626" stroke-width="1"/>
  <!-- Highlight star -->
  <text x="584" y="142" text-anchor="end" font-size="18" fill="#fbbf24">&#9733;</text>
  <text x="56" y="145" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#f5f5f5">Miso Glazed Salmon</text>
  <rect x="56" y="155" width="68" height="22" rx="11" fill="#10b981" opacity="0.15"/>
  <text x="90" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#10b981">Seafood</text>
  <rect x="132" y="155" width="42" height="22" rx="11" fill="#a78bfa" opacity="0.2"/>
  <text x="153" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="11" fill="#a78bfa">New</text>
  <!-- Metadata row -->
  <text x="56" y="198" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Prep: 15 min</text>
  <text x="175" y="198" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Cook: 20 min</text>
  <text x="300" y="198" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Serves: 2</text>
  <!-- Ingredients preview -->
  <text x="410" y="198" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">salmon, miso, mirin, soy sauce, ginger...</text>

  <!-- Recipe card 2 -->
  <rect x="36" y="236" width="568" height="108" rx="10" fill="#171717" stroke="#262626" stroke-width="1"/>
  <text x="56" y="267" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#f5f5f5">Spicy Thai Basil Chicken</text>
  <rect x="56" y="277" width="68" height="22" rx="11" fill="#10b981" opacity="0.15"/>
  <text x="90" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="500" font-size="12" fill="#10b981">Chicken</text>
  <!-- Metadata row -->
  <text x="56" y="320" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Prep: 10 min</text>
  <text x="175" y="320" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Cook: 15 min</text>
  <text x="300" y="320" font-family="system-ui, sans-serif" font-size="13" fill="#6b7280">Serves: 4</text>
  <text x="410" y="320" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">chicken thigh, thai basil, garlic, chili...</text>
</svg>
